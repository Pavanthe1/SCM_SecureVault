name: Status Accounting Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_status_report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-Status-Accounting-Report
          path: |
            status_accounting_report.html
            status_accounting_commits.csv
            status_accounting_issues.csv
          retention-days: 30
